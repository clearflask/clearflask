name: Deploy & Restart

on:
  workflow_dispatch:

# Least privilege for GITHUB_TOKEN: nothing here writes to the repository.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
      - name: Setup Java
        uses: actions/setup-java@e9fbacdec3bb3b6036605a3e6f7995d66773a8c6 # v3
        with:
          java-version: '17'
          distribution: 'corretto'
          architecture: x64
      - name: Cache local Maven repository
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Setup FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@dbe266744738dd1fa54db0ecb35d11461c94a90a # v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup SSH key for running instances
        shell: bash
        run: |
          mkdir -p ~/.ssh/
          cat <<EOF >~/.ssh/id_gh_action.pem
          ${{ secrets.SSH_PRIVATE_KEY_EC2 }}
          EOF
          sudo chmod 600 ~/.ssh/id_gh_action.pem
          cat <<EOF >>~/.ssh/config
          Host ec2-*.compute*.amazonaws.com
            IdentityFile ~/.ssh/id_gh_action.pem
            User ec2-user
            StrictHostKeyChecking accept-new
          EOF
          sudo chmod 600 ~/.ssh/config
      - name: Maven build
        timeout-minutes: 60
        run: mvn clean install -pl '!clearflask-release'
      - name: Add profile credentials to ~/.aws/credentials
        run: |
          aws configure set aws_access_key_id ${{ secrets.AWS_ACCESS_KEY_ID }} --profile clearflask
          aws configure set aws_secret_access_key ${{ secrets.AWS_SECRET_ACCESS_KEY }} --profile clearflask
          aws configure set region ${{ secrets.AWS_DEFAULT_REGION }} --profile clearflask
      - name: Maven deploy
        timeout-minutes: 60
        run: |
          AWS_PROFILE=clearflask make deploy-singlehost
