##
## Platform-hosting (batteries-included) stack: server + connect + MariaDB only.
## No localstack/AWS: file content is on a local-disk volume and DynamoDB is embedded
## (file-backed) inside the server container. Intended for one-click marketplace deploys.
## IMPORTANT: the server image is amd64-only in this mode (embedded DynamoDB's sqlite4java
## native lib has no arm64 build). Self-hosters wanting real DynamoDB/S3 should instead use
## docker-compose.self-host.yml.
##
## BEFORE STARTING: set a fresh shared Connect<->Server token (the server refuses to start
## in production with the published default). Generate one and put it in a .env file next
## to this compose file:
##   echo "CLEARFLASK_CONNECT_TOKEN=$(openssl rand -hex 16)" > .env
## One-click marketplace platforms inject this automatically (per-install secret).
version: '3.8'
volumes:
  data:
    driver: local
services:
  clearflask-connect:
    image: ghcr.io/clearflask/clearflask-connect:latest
    depends_on:
      - clearflask-server
    ports:
      - 80:9080
      - 443:9443
    environment:
      - NODE_ENV=production
      # 'platform' makes the dashboard single-tenant (no subdomain picking, one project);
      # Connect otherwise behaves like selfhost. The server uses CLEARFLASK_ENVIRONMENT=PRODUCTION_PLATFORM.
      - ENV=platform
      - CLEARFLASK_CREATE_CONNECT_CONFIG_IF_MISSING=1
      - CLEARFLASK_CONNECT_TOKEN=${CLEARFLASK_CONNECT_TOKEN:?set a generated shared token, e.g. openssl rand -hex 16}
      # Connect proxies the API to the server container over the compose network.
      - CLEARFLASK_API_BASE_PATH=http://clearflask-server:8080
      - CLEARFLASK_DOMAIN=${CLEARFLASK_DOMAIN:-localhost}
      # HTTPS handling: default on (real deploys terminate TLS / auto-fetch a cert). For local
      # http://localhost testing set these to 0/1 in .env so Connect doesn't force HTTPS.
      - CLEARFLASK_FORCE_REDIRECT_HTTPS=${CLEARFLASK_FORCE_REDIRECT_HTTPS:-1}
      - CLEARFLASK_DISABLE_AUTO_FETCH_CERTIFICATE=${CLEARFLASK_DISABLE_AUTO_FETCH_CERTIFICATE:-0}
    volumes:
      - ./connect:/opt/clearflask/
  clearflask-server:
    image: ghcr.io/clearflask/clearflask-server:latest
    platform: linux/amd64
    ports:
      - 8080:8080
    environment:
      - CLEARFLASK_ENVIRONMENT=PRODUCTION_PLATFORM
      - CLEARFLASK_CREATE_SERVER_CONFIG_IF_MISSING=1
      - CLEARFLASK_CONNECT_TOKEN=${CLEARFLASK_CONNECT_TOKEN:?set a generated shared token, e.g. openssl rand -hex 16}
      # Cap the JVM footprint for memory-constrained one-click hosts (e.g. Railway's
      # 1 GB plan). Without this the default max heap (25% of detected RAM) plus
      # metaspace + Tomcat's WAR scan spikes RSS past the container limit and the
      # kernel OOM-kills the process mid-startup with no Java error. Tune up if your
      # host gives more memory.
      - JAVA_TOOL_OPTIONS=-Xmx256m -XX:MaxMetaspaceSize=224m -Xss512k -XX:ReservedCodeCacheSize=64m -XX:+ExitOnOutOfMemoryError
    volumes:
      - ./server:/opt/clearflask/
      # Embedded DynamoDB file-backed store — the source-of-truth datastore. Back this up.
      - ./data/dynamo:/opt/clearflask/dynamo
      # Uploaded file content (local-disk content store)
      - ./data/content:/opt/clearflask/content
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/api/health" ]
      interval: 5s
      timeout: 15s
      retries: 2
  # MySQL/MariaDB is the search/index engine (still required)
  mysql-db:
    image: mariadb:10.5
    command:
      - 'mysqld'
      - '--port=3306'
      - '--sql-mode=IGNORE_SPACE'
      - '--explicit-defaults-for-timestamp'
      - '--secure-file-priv=/tmp'
      # Listen on IPv6 too. Platforms with IPv6-only private networking (e.g. Railway)
      # can't reach an IPv4-only mysqld, which black-holes the server's startup connect.
      - '--bind-address=::'
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./mysql-db:/docker-entrypoint-initdb.d
    ports:
      - 3306:3306
    environment:
      - MYSQL_ROOT_PASSWORD=clearflask
